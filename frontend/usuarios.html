<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários e papéis | Vag.ai</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="js/admin-ui.js" defer></script>
    <script src="js/usuarios.js" defer></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-6 py-5">
            <a href="painel.html" class="text-2xl font-bold text-emerald-600">Vag.ai</a>

            <nav aria-label="Navegação principal" class="flex flex-wrap items-center gap-3 sm:gap-6">
                <a href="painel.html" 
                    class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:text-emerald-600">Vagas</a>
                <a id="users-nav-link" href="usuarios.html" aria-current="page" hidden
                    class="rounded-lg px-3 py-2 text-sm font-medium bg-emerald-50 text-emerald-700">Usuários e papéis</a>
                <button id="logout-button" type="button"
                    class="rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100">Sair</button>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-6 py-12">
        <p id="page-message" role="status" aria-live="polite">Verificando seu acesso...</p>
        <button id="retry-button" type="button" hidden
            class="mt-4 rounded-lg bg-emerald-600 px-4 py-2 font-semibold text-white hover:bg-emerald-700">
            Tentar novamente
        </button>

        <section id="users-section" class="mt-6" aria-labelledby="users-title" hidden>
            <h1 id="users-title" class="text-3xl font-bold">
                Usuários e papéis
            </h1>

            <p class="mt-2 text-sm text-slate-500">
                Defina quais usuários fazem parte da equipe de RH.
            </p>

            <button id="create-user" type="button" class="mt-5 rounded-lg bg-emerald-600 px-4 py-2 font-semibold text-white hover:bg-emerald-700 disabled:opacity-50">Cadastrar usuário</button>

            <p id="users-message" class="mt-3 text-sm text-slate-600" role="status" aria-live="polite"></p>

            <div id="users-list" class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-2"></div>
        </section>
    </main>

    <template id="user-template">
        <article class="rounded-xl border border-slate-200 bg-white p-6">
            <h3 class="user-name text-lg font-bold"></h3>
            <p class="user-email mt-1 text-sm text-slate-500"></p>

            <p class="user-role mt-3 text-sm text-slate-600"></p>
            <div class="mt-5 flex flex-wrap gap-3">
                <button type="button" class="edit-user rounded-lg border border-slate-300 px-4 py-2 font-medium hover:bg-slate-100 disabled:opacity-50">Editar usuário</button>
                <button type="button" class="delete-user rounded-lg border border-slate-300 px-4 py-2 font-medium hover:bg-slate-100 disabled:opacity-50 text-red-700">Excluir</button>
            </div>
            <p class="user-message mt-3 text-sm text-red-700" role="status"></p>
        </article>
    </template>

    <dialog id="user-dialog" aria-labelledby="user-dialog-title" class="m-auto max-h-[90vh] w-[calc(100%-2rem)] max-w-xl overflow-y-auto rounded-2xl p-6 backdrop:bg-slate-900/40">
        <h2 id="user-dialog-title" class="text-2xl font-bold"></h2>
        <form id="user-editor" class="mt-5 space-y-4">
            <label class="block text-sm font-medium">
                Nome completo
                <input name="full_name" type="text" required class="mt-2 block w-full rounded-lg border border-slate-300 bg-white p-3 disabled:opacity-50">
            </label>
            <label class="block text-sm font-medium">
                E-mail
                <input name="email" type="email" required class="mt-2 block w-full rounded-lg border border-slate-300 bg-white p-3 disabled:opacity-50">
            </label>
            <label class="block text-sm font-medium">
                Senha (ao editar, deixe em branco para manter)
                <input name="password" type="password"  class="mt-2 block w-full rounded-lg border border-slate-300 bg-white p-3 disabled:opacity-50">
            </label>
            <label class="block text-sm font-medium">
                Papel
                <select name="role" required class="mt-2 block w-full rounded-lg border border-slate-300 bg-white p-3 disabled:opacity-50">
                    <option value="CANDIDATO">Candidato</option>
                    <option value="RECRUTADOR">Recrutador</option>
                    <option value="GERENTE_RH">Gerente de RH</option>
                </select>
            </label>
            <p class="editor-message text-sm text-red-700" role="status" aria-live="polite"></p>
            <div class="flex flex-wrap gap-3">
                <button type="submit" class="rounded-lg bg-emerald-600 px-4 py-2 font-semibold text-white hover:bg-emerald-700 disabled:opacity-50">Salvar</button>
                <button type="button" class="cancel-editor rounded-lg border border-slate-300 px-4 py-2 font-medium hover:bg-slate-100 disabled:opacity-50">Cancelar</button>
            </div>
        </form>
    </dialog>
</body>

</html>
