<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vag.ai</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="js/login.js" defer></script>
</head>

<body class="flex min-h-screen flex-col bg-white font-sans text-slate-900">
    <header class="mx-auto flex w-full max-w-6xl items-center justify-between px-6 py-6">
        <a href="index.html" class="text-2xl font-bold tracking-tight text-emerald-600">Vag.ai</a>

        <nav aria-label="Navegação principal" class="flex items-center gap-6">
            <a href="#email"
                class="text-sm font-medium text-slate-600 transition-colors hover:text-emerald-600">Entrar</a>
            <a href="cadastro.html"
                class="rounded-full bg-emerald-600 px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-emerald-700">Criar
                conta</a>
        </nav>
    </header>

    <main class="mx-auto grid w-full max-w-6xl flex-1 grid-cols-1 items-center gap-12 px-6 py-16 md:grid-cols-2">
        <section aria-labelledby="titulo-principal">
            <h1 id="titulo-principal" class="text-4xl font-bold leading-tight tracking-tight md:text-5xl">Sua próxima
                <span class="text-emerald-600">oportunidade</span> começa aqui
            </h1>

            <p class="mt-6 text-lg leading-relaxed text-slate-500">
                Encontre vagas, compartilhe seu talento e acompanhe suas candidaturas em um só lugar.
            </p>


        </section>

        <section aria-labelledby="titulo-login"
            class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-lg md:justify-self-end">
            <h2 id="titulo-login" class="text-2xl font-bold">Bem-vindo</h2>

            <p class="mt-2 text-sm text-slate-500">Entre para acessar o seu espaço.</p>

            <form id="login-form" class="mt-8 space-y-5">
                <div>
                    <label for="email" class="mb-2 block text-sm font-medium text-slate-700">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="username" required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100">
                </div>

                <div>
                    <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Senha</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100">
                </div>

                <p id="login-message" class="text-sm text-slate-600" role="status" aria-live="polite"></p>

                <button type="submit"
                    class="w-full rounded-lg bg-emerald-600 px-4 py-3 font-semibold text-white transition-colors hover:bg-emerald-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600">
                    Entrar</button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-500">
                Ainda não tem conta?
                <a href="cadastro.html" class="font-medium text-emerald-600 hover:underline">Criar conta</a>
            </p>

        </section>

    </main>

    <footer class="mx-auto w-full max-w-6xl px-6">
        <div
            class="flex flex-col gap-2 border-t border-slate-200 py-6 text-sm text-slate-500 md:flex-row md:items-center md:justify-between">
            <p>Vag.ai</p>
            <p>Conectando talentos a novas oportunidades</p>
        </div>

    </footer>

</body>

</html>
